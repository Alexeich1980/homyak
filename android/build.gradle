// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
        // RuStore Pay SDK (платежи «Полного доступа») лежит в maven-репозитории RuStore, не в
        // mavenCentral. ЕДИНСТВЕННЫЙ актуальный хост - nexus-external.rustore.ru (письмо RuStore:
        // старый artifactory-external.vkpartner.ru перестаёт работать с 01.10.2026, фолбэк убран).
        maven { url 'https://nexus-external.rustore.ru/repository/maven-rustore-exposed' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
