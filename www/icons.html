<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Хомяк · наборы иконок</title>
<style>
  :root {
    --bg: #0F1217; --card: #1E242D; --line: #333B47; --ink: #E8ECF1; --muted: #8B95A5;
    --track: #2A313C; --ico: #FFFFFF; --teal: #2BB39A; --gold: #F2C21B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.35;
    -webkit-font-smoothing: antialiased;
  }
  header { padding: 18px 16px 8px; }
  h1 { margin: 0; font-size: 20px; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .sub a { color: var(--teal); }
  h2 {
    margin: 22px 16px 2px; font-size: 15px; letter-spacing: -.2px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .cnt { color: var(--muted); font-weight: 400; font-size: 12px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 14px 6px; padding: 14px 12px 4px;
  }
  .it { text-align: center; min-width: 0; }
  .cir {
    width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 6px;
    display: grid; place-items: center; background: var(--track); color: var(--ico);
  }
  .wallet .cir { background: var(--gold); color: #3A2E05; }
  .lab { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .key {
    font: 10px/1.3 ui-monospace, Consolas, monospace; color: var(--muted); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  footer { padding: 18px 16px 28px; color: var(--muted); font-size: 12px; }
</style></head><body>
<header>
  <h1>Наборы иконок</h1>
  <div class="sub">Три набора: кошельки, расходы, доходы. <a href="preview.html">к превью приложения</a></div>
</header>
<div id="out"></div>
<footer>Подбор по названию: <code>Icons.guessKind(name, 'wallet'|'exp'|'inc')</code></footer>

<script src="icons.js"></script>
<script>
(function () {
  'use strict';
  var SECTIONS = [
    { kind: 'wallet', title: 'Кошельки' },
    { kind: 'exp', title: 'Расходы' },
    { kind: 'inc', title: 'Доходы' }
  ];
  var out = document.getElementById('out'), html = '';
  SECTIONS.forEach(function (s) {
    var names = Icons.list(s.kind);
    html += '<h2>' + s.title + ' <span class="cnt">' + names.length + '</span></h2>';
    html += '<div class="grid ' + s.kind + '">' + names.map(function (n) {
      return '<div class="it">' +
        '<div class="cir">' + Icons.svg(n, 28) + '</div>' +
        '<div class="lab">' + (Icons.LABELS[n] || n) + '</div>' +
        '<div class="key">' + n + '</div>' +
      '</div>';
    }).join('') + '</div>';
  });
  out.innerHTML = html;
})();
</script>
</body></html>
